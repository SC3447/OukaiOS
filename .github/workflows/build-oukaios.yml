name: Build OukaiOS 1.0 ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up cloud runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Install ISO packaging tools & latest debootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools live-build debootstrap curl
          sudo ln -sf /usr/share/debootstrap/scripts/sid /usr/share/debootstrap/scripts/trixie

      - name: Configure OukaiOS 1.0 Live Build
        run: |
          mkdir -p build && cd build
          lb config \
            --distribution trixie \
            --debian-installer live \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootappend-live "boot=live components quiet splash"

          # Pre-install desktop, browser, audio, and GUI dependencies
          mkdir -p config/package-lists
          cat << 'EOF' > config/package-lists/oukaios.list.chroot
          xfce4
          xfce4-goodies
          lightdm
          lightdm-gtk-greeter
          firefox-esr
          nginx
          mpv
          python3-tk
          python3-pil
          python3-pil.imagetk
          python3-pip
          ffmpeg
          alsa-utils
          plymouth
          plymouth-themes
          calamares
          EOF

          # Copy all your custom oukaios-files into the live filesystem
          mkdir -p config/includes.chroot
          cp -r ../oukaios-files/* config/includes.chroot/ 2>/dev/null || true

      - name: Build OukaiOS 1.0 ISO
        run: |
          cd build
          sudo lb build
          mv live-image-amd64.hybrid.iso ../OukaiOS-1.0.iso

      - name: Publish OukaiOS-1.0.iso to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "歐開OS (OukaiOS) 1.0 — Official Sovereign Release"
          files: OukaiOS-1.0.iso

